[project]
name = "strido-cad"
version = "0.2.0"
description = "Strido CAD pipeline: upstream STEP registration, kinematics extraction, Strido parts (CadQuery), vendor models, fasteners, assembly posing, code and model generation"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "strido-core",
    "cadquery==2.8.0",
    "trimesh==5.2.0",
    "manifold3d==3.5.4",
    "rtree==1.4.1",
    "scipy==1.18.1",
    "shapely==2.2.0",
    "networkx==3.7",
    "lxml==6.1.3",
    "fast-simplification==0.2.0",
    "pyyaml==6.0.3",
]

[tool.uv.sources]
strido-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strido_cad"]
