[project]
name = "strido-verify"
version = "0.2.0"
description = "Strido physical verification: interference, range of motion, fits and tolerances, clearances, sensor field of view, printability"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["strido-core", "strido-cad", "matplotlib==3.11.2", "pyyaml==6.0.3", "scipy==1.18.1"]

[tool.uv.sources]
strido-core = { workspace = true }
strido-cad = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strido_verify"]
