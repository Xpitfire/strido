[project]
name = "strido-sim"
version = "0.2.0"
description = "Strido MuJoCo simulation: gait walk demo, Gymnasium velocity-tracking environment, PPO training and evaluation"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["strido-core", "mujoco==3.17.0", "imageio==2.38.1", "imageio-ffmpeg==0.7.0", "numpy>=1.24"]

[project.optional-dependencies]
rl = ["gymnasium==1.4.0", "stable-baselines3==2.9.2", "torch==2.15.0"]

[tool.uv.sources]
strido-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strido_sim"]
