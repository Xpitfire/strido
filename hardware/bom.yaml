# Strido bill of materials: single source for docs/bom/*.md (strido_publish.bom).
#
# lines[].qty     pieces needed (a kit counts as one piece)
# lines[].cad     CAD part/fastener id -> units one bought piece supplies. strido_publish.bom
#                 checks, for the offers every shopping strategy picks (packs rounded up), that
#                 every purchased part and fastener of the CAD assembly is covered (fasteners
#                 need max(2, 10 %) spares), so the shopping list cannot miss a bolt.
# offers[]        price = EUR incl. VAT per pack of `pack` pieces, as observed on 2026-10-30
#                 (agent research reports; see docs/bom/sources.md). status: observed | listing |
#                 approximate | unverified. Prices change: re-check before ordering.
# genuine: false  marks clone/third-party parts that are fine to use (see notes).
# vendors[].search  product search URL of the shop; {q} = the offer's order code (the SKU without
#                 notes in brackets; DigiKey: the -ND number). Used by the order configurator.

vendors:
  digikey_at:
    search: https://www.digikey.at/en/products/result?keywords={q}
    name: DigiKey.at
    shipping: 25.0
    free_from: 75.0
    region: US warehouse
    url: https://www.digikey.at
  amazon_de:
    search: https://www.amazon.de/s?k={q}
    name: Amazon.de
    shipping: 3.99
    free_from: 39.0
    per_order_fee: 2.4
    region: EU
    url: https://www.amazon.de
    note: +2.40 Austrian parcel tax per order
  aliexpress:
    search: https://de.aliexpress.com/item/{q}.html
    name: AliExpress (DigitalServo Store)
    shipping: 5.9
    free_from: null
    region: CN
    note: 'servo order > 150 EUR leaves IOSS: split into two orders or expect import VAT/clearance'
  reichelt_at:
    search: https://www.reichelt.at/at/de/shop/suche/{q}
    name: Reichelt.at
    shipping: 6.95
    free_from: null
    region: EU
    url: https://www.reichelt.at
  berrybase_at:
    search: https://www.berrybase.at/search?search={q}
    name: Berrybase.at
    shipping: 5.95
    free_from: 200.0
    region: EU
    url: https://www.berrybase.at
  welectron:
    search: https://www.welectron.com/search/?qs={q}
    name: Welectron (DE)
    shipping: 9.9
    free_from: null
    region: EU
    url: https://www.welectron.com
  eckstein:
    search: https://eckstein-shop.de/search/?qs={q}
    name: Eckstein (DE)
    shipping: 6.9
    free_from: null
    region: EU
    url: https://eckstein-shop.de
    note: 'shipping to AT not shown before checkout: 6.90 assumed (UNVERIFIED)'
  lindinger_at:
    search: https://www.lindinger.at/de/search?search={q}
    name: Lindinger.at
    shipping: 5.99
    free_from: 89.0
    region: EU
    url: https://www.lindinger.at
  threedjake_at:
    search: https://www.3djake.at/suche?q={q}
    name: 3DJake.at
    shipping: 5.49
    free_from: 49.9
    region: EU
    url: https://www.3djake.at
  schraubenking_at:
    search: https://www.schraubenking.at/search/?qs={q}
    name: Schraubenking.at
    shipping: 5.9
    free_from: 99.0
    region: EU
    url: https://www.schraubenking.at
  kugellager_express:
    search: https://www.kugellager-express.de/search?sSearch={q}
    name: kugellager-express.de
    shipping: 8.9
    free_from: null
    region: EU
    url: https://www.kugellager-express.de
