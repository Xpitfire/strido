  ubec_front.in:       {vendor: hobbywing_ubec_10a, match: front legs, local: [45.0, 10.0, 8.1], out: [1, 0, 0], end: solder}
  ubec_front.out:      {vendor: hobbywing_ubec_10a, match: front legs, local: [0.0, 10.0, 8.1], out: [-1, 0, 0], end: solder}
  ubec_rear.in:        {vendor: hobbywing_ubec_10a, match: rear legs, local: [0.0, 10.0, 8.1], out: [-1, 0, 0], end: solder}
  ubec_rear.out:       {vendor: hobbywing_ubec_10a, match: rear legs, local: [45.0, 10.0, 8.1], out: [1, 0, 0], end: solder}
  pi.gpio_power:       {vendor: raspberry_pi_5, local: [16.0, 53.8, 17.9], out: [0, 0, 1], end: crimp}
