  pi.usb_low:          {vendor: raspberry_pi_5, local: [99.0, 29.0, 5.3], out: [0, 0, -1], end: plug}
  pi.usb_high:         {vendor: raspberry_pi_5, local: [99.0, 29.0, 13.3], out: [0, 1, 0], end: plug}
  pi.cam0:             {vendor: raspberry_pi_5, local: [50.0, 13.0, 5.0], out: [0, 0, 1], end: plug}
  pca.header_left:     {vendor: adafruit_pca9685, local: [1.3, 12.0, 18.1], out: [0, 0, 1], end: crimp}
  pca.header_right:    {vendor: adafruit_pca9685, local: [60.9, 12.0, 18.1], out: [0, 0, 1], end: plug}
  xiao.pins:           {vendor: seeed_xiao_esp32s3, local: [10.5, 8.9, -8.5], out: [0, 0, -1], end: solder}
