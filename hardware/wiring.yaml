# Strido wiring harness: the single source for every cable, its connectors and its route.
#
# strido_cad.wiring routes every cable through the CAD (STEP frame, mm, CAD reference pose) and
# adds the cables, spiral-wrap sleeves and ties to the assembly (renders, 3D viewer, manual).
# strido_verify.wiring checks: every lead reaches (supplied length), every loop across a hip
# joint has slack over the whole hip range, bends, connector ports, wire consumption against the
# BOM, and clearance to every part in every pose (rigid runs) - docs/verification/wiring.md.
# strido_verify.electronics checks ampacity and fuses on the cables that carry a power branch.
#
# Coordinates: STEP frame (x lateral, +x = left; y longitudinal, -y = front; z up). The body is
# symmetric about x = -5: nodes named *.L are mirrored to *.R for the right legs. Nodes with
# body: hip move with the leg's hip (front.* -> FL/FR, rear.* -> RL/RR).

anchor_stub_mm: {default: 4.0, wago: 1.2}  # straight lead-out from a connector before the cable may bend
sleeve_wall_mm: 0.3        # spiral wrap over bundles of >= 3 cables
sleeve_kg_per_m: 0.012     # PE spiral wrap, 6 mm
termination_mm:            # extra length per end beyond the routed path (strip, crimp, solder cup)
  wago: 11.0               # WAGO 221 strip length
  solder: 6.0
  crimp: 3.0
  plug: 0.0                # moulded plug: the anchor is the cable exit of the plug
  screw: 7.0               # screw terminal strip length
slack:                     # every cut wire is cut this much longer than routed (re-termination, dressing)
  fraction: 0.08
  min_mm: 10.0
# Wire per unit of a BOM line (its cheapest offer in hardware/bom.yaml), per colour; the gate multiplies
# by the line's qty. 14/18 AWG: Lindinger 20479/44422, 1 m red + 1 m black; 22 AWG: 6 colours x 4 m;
# spiral wrap: the shorter offer, 5 m.
stock_per_unit_mm:
  wire_14awg: {red: 1000, black: 1000}
  wire_18awg: {red: 1000, black: 1000}
  wire_22awg: {red: 4000, black: 4000, yellow: 4000, blue: 4000, green: 4000, white: 4000}
  spiral_wrap: {black: 5000}
# Ready-made pieces per BOM unit (Dupont set: 40 female-female jumpers; ties: bag of 100).
pieces_per_unit: {dupont_set: 40, cable_ties: 100}

# Cable types. od_mm: outer diameter of one conductor or of the round cable; strand_mm: spacing of
# the drawn conductors for multi-colour cables; supplied_mm: fixed length of a ready-made cable
# (absent = cut to length from the BOM line); colours: drawn conductors (render colour names).
cable_types:
  wire_14awg_pair:   {conductors: 2, od_mm: 3.6, strand_mm: 3.6, colours: [red, black], kg_per_m: 0.070, bom: wire_14awg, gauge: 14 AWG, min_bend_mm: 11}
  wire_14awg_red:    {conductors: 1, od_mm: 3.6, strand_mm: 3.6, colours: [red], kg_per_m: 0.035, bom: wire_14awg, gauge: 14 AWG, min_bend_mm: 11}
  wire_14awg_black:  {conductors: 1, od_mm: 3.6, strand_mm: 3.6, colours: [black], kg_per_m: 0.035, bom: wire_14awg, gauge: 14 AWG, min_bend_mm: 11}
  wire_18awg_pair:   {conductors: 2, od_mm: 2.2, strand_mm: 2.2, colours: [red, black], kg_per_m: 0.030, bom: wire_18awg, gauge: 18 AWG, min_bend_mm: 7}
  fuse_holder_lead:  {conductors: 1, od_mm: 3.6, strand_mm: 3.6, colours: [red], kg_per_m: 0.035, supplied_mm: 150, gauge: 14 AWG, min_bend_mm: 11, source: "in-line ATO holder, 14 AWG loop ~305 mm cut in half (Nilight B07426WCLM) [MEASURE]"}
  wire_18awg_red:    {conductors: 1, od_mm: 2.2, strand_mm: 2.2, colours: [red], kg_per_m: 0.015, bom: wire_18awg, gauge: 18 AWG, min_bend_mm: 7}
  wire_18awg_black:  {conductors: 1, od_mm: 2.2, strand_mm: 2.2, colours: [black], kg_per_m: 0.015, bom: wire_18awg, gauge: 18 AWG, min_bend_mm: 7}
  wire_22awg_pair:   {conductors: 2, od_mm: 1.6, strand_mm: 1.6, colours: [red, black], kg_per_m: 0.014, bom: wire_22awg, gauge: 22 AWG, min_bend_mm: 5}
  wire_22awg_quad:   {conductors: 4, od_mm: 1.6, strand_mm: 1.6, colours: [red, red, black, black], kg_per_m: 0.028, bom: wire_22awg, gauge: 22 AWG, min_bend_mm: 5}
  battery_core_red:  {conductors: 1, od_mm: 4.2, strand_mm: 4.2, colours: [red], kg_per_m: 0.045, supplied_mm: 120, gauge: 12 AWG, min_bend_mm: 13, source: "Gens ace 2S 5000 soft-case listing (~120 mm, 12 AWG); hardcase not published [MEASURE]"}
  battery_core_black: {conductors: 1, od_mm: 4.2, strand_mm: 4.2, colours: [black], kg_per_m: 0.045, supplied_mm: 120, gauge: 12 AWG, min_bend_mm: 13, source: "as battery_core_red"}
  servo_lead:        {conductors: 3, od_mm: 1.3, strand_mm: 1.3, colours: [brown, red, orange], kg_per_m: 0.018, supplied_mm: 260, gauge: 22 AWG, min_bend_mm: 4, source: "SPT5435LV-180W spec page: connector wire length 260 mm"}
  servo_power:       {conductors: 2, od_mm: 1.3, strand_mm: 1.3, colours: [brown, red], kg_per_m: 0.012, gauge: 22 AWG, min_bend_mm: 4}
  servo_signal:      {conductors: 1, od_mm: 1.3, strand_mm: 1.3, colours: [orange], kg_per_m: 0.006, gauge: 22 AWG, min_bend_mm: 4}
  wire_22awg_i2c:    {conductors: 4, od_mm: 1.6, strand_mm: 1.6, colours: [red, black, yellow, blue], kg_per_m: 0.028, bom: wire_22awg, gauge: 22 AWG, min_bend_mm: 5}
  wire_22awg_white:  {conductors: 1, od_mm: 1.6, strand_mm: 1.6, colours: [white], kg_per_m: 0.007, bom: wire_22awg, gauge: 22 AWG, min_bend_mm: 5}
  wire_22awg_green:  {conductors: 1, od_mm: 1.6, strand_mm: 1.6, colours: [green], kg_per_m: 0.007, bom: wire_22awg, gauge: 22 AWG, min_bend_mm: 5}
  dupont_1:          {conductors: 1, od_mm: 1.2, strand_mm: 1.2, colours: [green], kg_per_m: 0.003, supplied_mm: 200, bom: dupont_set, min_bend_mm: 3}
  stemma_qt:         {conductors: 4, od_mm: 2.4, strand_mm: 2.4, colours: [black], kg_per_m: 0.012, supplied_mm: 150, bom: stemma_qt_female, min_bend_mm: 6}
  lcd_cable:         {conductors: 8, od_mm: 3.2, strand_mm: 3.2, colours: [grey], kg_per_m: 0.020, supplied_mm: 200, source: "Waveshare 2inch LCD Module: PH2.0 8-pin cable, 20 cm, supplied with the display", min_bend_mm: 6}
  usb_a_c:           {conductors: 4, od_mm: 3.5, strand_mm: 3.5, colours: [black], kg_per_m: 0.030, supplied_mm: 200, bom: usb_a_c_short, min_bend_mm: 15}
  camera_ffc:        {conductors: 22, od_mm: 2.0, strand_mm: 2.0, colours: [ffc], kg_per_m: 0.010, supplied_mm: 300, bom: camera_cable_300, min_bend_mm: 2, flat: true}
  lidar_cable:       {conductors: 5, od_mm: 2.6, strand_mm: 2.6, colours: [black], kg_per_m: 0.012, ready_made: true, source: "RPLIDAR C1 sensor cable to the USB adapter (supplied; length not published [MEASURE])", min_bend_mm: 6}

# Connector anchors in the canonical frame of a vendor part (strido_cad.vendor documents each
# frame): local point where the cable leaves the connector and the direction it leaves in.
# `match` selects one placement by its label when a vendor part is placed more than once.
# Parametric anchors need no entry: servo:<leg>.<joint>, wago:<cavity>.<bay>.p<port>, pca:<channel>.
anchors:
  battery.lead_red:    {vendor: lipo_2s_5000_gensace, local: [138.0, 21.0, 20.0], out: [1, 0, 0], end: plug}
  battery.lead_black:  {vendor: lipo_2s_5000_gensace, local: [138.0, 26.0, 20.0], out: [1, 0, 0], end: plug}
  xt60_battery.pack_red:   {vendor: xt60h_female, match: battery input, local: [-3.6, 0.0, -20.0], out: [0, 0, -1], end: plug}  # the pack's mated XT60 plug ends 20 mm out of the hood
  xt60_battery.pack_black: {vendor: xt60h_female, match: battery input, local: [3.6, 0.0, -20.0], out: [0, 0, -1], end: plug}
  xt60_battery.robot_red:   {vendor: xt60h_female, match: battery input, local: [-3.6, 0.0, 23.5], out: [0, 0, 1], end: solder}
  xt60_battery.robot_black: {vendor: xt60h_female, match: battery input, local: [3.6, 0.0, 23.5], out: [0, 0, 1], end: solder}
  xt60_arming.cups:    {vendor: xt60h_female, match: arming jack, local: [0.0, 0.0, 23.5], out: [0, 0, 1], end: solder}
  fuse_main.in:        {vendor: fuse_holder_ato, match: 25 A main, local: [-27.0, 0.0, 4.1], out: [-1, 0, 0], end: solder}
  fuse_main.out:       {vendor: fuse_holder_ato, match: 25 A main, local: [27.0, 0.0, 4.1], out: [1, 0, 0], end: solder}
