  lidar_adapter.usb:   {vendor: rplidar_usb_adapter, local: [34.0, 11.0, 5.0], out: [1, 0, 0], end: plug}

# Route nodes (STEP mm). tie: cable tie (to the named structure); loop_mm + bulge: the free length
# from this node to the next one on another body (a lead crossing the hip joint), drawn bowed
# towards `bulge`. The router fills the legs between consecutive base nodes.
nodes:
  # --- front cavity, left leg (mirrored to .R): servo leads cross the hip joint near its axis
  front.thigh_tie.L:  {at: [20.5, -84.5, 79.0], body: hip, tie: servo mount plate edge, loop_mm: 30, bulge: [0, -1, 0]}
  front.thigh_base.L: {at: [8.5, -84.0, 86.0], tie: upper shoulder frame slot edge}
  front.calf_turn.L:  {at: [20.5, -133.0, 58.7], body: hip}
  front.calf_tie.L:   {at: [20.5, -131.0, 76.7], body: hip, tie: servo mount plate edge, loop_mm: 32, bulge: [0, 1, 0]}
  front.calf_base.L:  {at: [10.0, -114.0, 76.0], tie: bus holder tie slot}
  front.hip_top.L:    {at: [30.0, -50.0, 98.0], tie: hip servo lead to the servo ear}
  # --- rear cavity, left leg (mirrored to .R); the main fuse holder fills the corridor above z 75,
  # so the leads cross under it
  rear.thigh_tie.L:   {at: [22.0, 155.0, 79.0], body: hip, tie: servo mount plate edge, loop_mm: 22, bulge: [0, -1, 0]}
  rear.thigh_base.L:  {at: [12.5, 150.0, 71.0], tie: bus holder tie slot}
  rear.calf_turn.L:   {at: [22.0, 106.5, 58.7], body: hip}
  rear.calf_tie.L:    {at: [22.0, 106.5, 76.0], body: hip, tie: servo mount plate edge, loop_mm: 22, bulge: [0, 1, 0]}
  rear.calf_base.L:   {at: [12.5, 112.0, 71.0], tie: bus holder tie slot}
  rear.hip_top.L:     {at: [30.0, 72.0, 98.0], tie: hip servo lead to the servo ear}
  # --- cavity trunks: leads split above the WAGO bus; power drops to the +x wire entries
  front.split0:       {at: [8.5, -122.0, 74.0], tie: bus holder tie slot (bay 0)}
  front.split1:       {at: [8.5, -86.0, 74.0], tie: bus holder tie slot (bay 1)}
  rear.split0:        {at: [8.0, 108.0, 70.0], tie: bus holder tie slot (bay 0)}
  rear.split1:        {at: [8.0, 144.0, 70.0], tie: bus holder tie slot (bay 1)}
  front.opening:      {at: [-10.0, -66.5, 88.0], tie: inner shoulder frame opening}
  rear.opening:       {at: [-5.0, 88.5, 84.0], tie: inner shoulder frame opening}
  front.outer_opening: {at: [-5.0, -141.5, 80.0], tie: outer shoulder frame opening}
  rear.outer_opening: {at: [-5.0, 163.5, 70.0], tie: outer shoulder frame opening}
  rear.opening_low:   {at: [4.0, 88.5, 56.0]}
  # --- middle body: signals to the PCA9685 beside the Pi cooler fan, power boards behind
  mid.front_trunk:    {at: [-24.0, -30.0, 97.0]}
  mid.pca_front:      {at: [-8.0, 24.0, 100.0]}
  mid.pca_rear:       {at: [-2.0, 46.0, 98.0]}
  mid.pca_left:       {at: [-33.0, 34.0, 96.0]}
  mid.right_strip:    {at: [-45.0, 30.0, 74.5], tie: adhesive tie mount on the deck, mount: {at: [-45.0, 30.0, 67.6], normal: [0, 0, 1]}}
  mid.left_strip:     {at: [33.0, 0.0, 74.5], tie: adhesive tie mount on the deck, mount: {at: [33.0, 0.0, 67.6], normal: [0, 0, 1]}}
  mid.over_power:     {at: [-12.0, 84.0, 86.0]}
  # --- under the deck: battery pocket (left, behind the front UBEC) and the channels round the pack
  mid.ground_star:    {at: [35.0, 64.0, 42.0], tie: heat-shrunk splice}
  mid.ubec_split:     {at: [30.0, 74.0, 42.0], tie: heat-shrunk splice}
  mid.right_low:      {at: [-49.0, 20.0, 46.0]}
  # --- front shell: camera ribbon and display cable
  front.ffc_shell:    {at: [-5.0, -148.0, 88.0]}
  # --- top: LiDAR cable slot in the top shell, notch in the pedestal
  top.lidar_slot:     {at: [-5.0, 38.0, 101.0]}
  top.pedestal_notch: {at: [-5.0, 31.0, 118.5]}
  # --- back shell
  back.splice:        {at: [-5.0, 175.0, 50.0], tie: heat-shrunk splice}

# Servo leads: the 260 mm lead of every servo is tied at its base node (cavity) or at the inner frame
# opening (hip servos). There the red/brown pair is peeled off, cut to length and clamped in the leg's
# WAGO pair; the orange signal wire is cut to length, re-crimped (female Dupont contact, 1-pin housing)
# and plugged on the PCA9685 channel of hardware/electronics.yaml servos.channels. No extensions.
servo_leads:
  type: servo_lead
  power_type: servo_power
  signal_type: servo_signal
  bay: {FL: front, FR: front, RL: rear, RR: rear}
  wago_bay: {FL: 0, FR: 1, RL: 0, RR: 1}
  wago_port: {hip: 1, thigh: 2, calf: 3}   # port 0: UBEC feed (bay 0) or jumper (bay 1); port 4: jumper (bay 0)
  route:
    hip:   {trunk: ["{bay}.hip_top.{side}", "{bay}.opening"], power: ["{bay}.split{wago}"], signal: ["mid.pca_{bay}"]}
    thigh: {trunk: ["{bay}.thigh_tie.{side}", "{bay}.thigh_base.{side}"], power: ["{bay}.split{wago}"], signal: ["{bay}.opening", "mid.pca_{bay}"]}
    calf:  {trunk: ["{bay}.calf_turn.{side}", "{bay}.calf_tie.{side}", "{bay}.calf_base.{side}"], power: ["{bay}.split{wago}"], signal: ["{bay}.opening", "mid.pca_{bay}"]}

cables:
  # --- power entry (servo domain left, logic domain right in docs/electronics.md)
  - {id: W00, via: [], cores: [{name: red, type: battery_core_red, from: battery.lead_red, to: xt60_battery.pack_red}, {name: black, type: battery_core_black, from: battery.lead_black, to: xt60_battery.pack_black}], note: "the pack's own lead into the robot's XT60H (battery input, under the deck)"}
  - {id: W01, type: wire_14awg_red, from: xt60_battery.robot_red, to: fuse_main.in, carries: pack, sleeve: true, via: [rear.opening_low], note: "unfused: the 25 A fuse sits in the rear cavity, ~0.15 m from the pack"}
  - {id: W02, type: wire_14awg_red, from: fuse_main.out, via: [rear.outer_opening, back.splice], carries: pack, branches: [{name: arming, type: wire_14awg_red, via: [], to: xt60_arming.cups}, {name: logic, type: fuse_holder_lead, via: [], to: fuse_logic.in}], note: "the logic holder's own 14 AWG lead is the tap: no thinner wire behind the 25 A fuse"}
  - {id: W03, type: wire_14awg_red, from: xt60_arming.cups, via: [rear.outer_opening, rear.opening_low, mid.ubec_split], carries: servo_branch, branches: [{name: front, type: wire_14awg_red, via: [], to: ubec_front.in}, {name: rear, type: wire_14awg_red, via: [mid.right_low], to: ubec_rear.in}], note: "second contact of the arming jack: the loop key bridges W02 to W03"}
  - {id: W04, type: wire_14awg_black, from: xt60_battery.robot_black, via: [mid.ground_star], carries: pack, branches: [{name: front, type: wire_14awg_black, via: [], to: ubec_front.in}, {name: rear, type: wire_14awg_black, via: [mid.right_low], to: ubec_rear.in}, {name: logic, type: wire_18awg_black, carries: logic_branch, via: [rear.opening_low, mid.over_power, mid.right_strip], to: switch.vin}], note: "ground star at the battery input"}
  - {id: W05, type: wire_18awg_pair, from: ubec_front.out, to: wago:front.0.p0, carries: ubec_front, via: [front.opening, front.split0], note: "UBEC output lead extended with 18 AWG"}
  - {id: W06, type: wire_18awg_pair, from: ubec_rear.out, to: wago:rear.0.p0, carries: ubec_rear, via: [rear.opening_low, rear.split0], note: "UBEC output lead extended with 18 AWG"}
  - {id: W07, carries: ubec_front, via: [], cores: [{name: vplus, type: wire_18awg_red, from: wago:front.0.p4.V+, to: wago:front.1.p0.V+}, {name: gnd, type: wire_18awg_black, from: wago:front.0.p4.GND, to: wago:front.1.p0.GND}], note: "bus jumpers to the second front leg, one per rail along the WAGO faces"}
  - {id: W08, carries: ubec_rear, via: [], cores: [{name: vplus, type: wire_18awg_red, from: wago:rear.0.p4.V+, to: wago:rear.1.p0.V+}, {name: gnd, type: wire_18awg_black, from: wago:rear.0.p4.GND, to: wago:rear.1.p0.GND}], note: "bus jumpers to the second rear leg, one per rail along the WAGO faces"}
  - {id: W09, type: wire_18awg_red, from: fuse_logic.out, to: switch.vin, carries: logic_branch, via: [rear.outer_opening, rear.opening, mid.over_power, mid.right_strip], note: "logic feed (+); its ground is W04/logic"}
  # --- logic domain
  - {id: W10, type: wire_18awg_red, from: switch.vout, to: ina.vin, carries: logic_branch, via: [mid.right_strip, mid.over_power], note: "switch VOUT -> INA260 VIN+ (high-side shunt)"}
  - {id: W11, type: wire_18awg_red, from: ina.vin, to: reg.vin, carries: logic_branch, via: [], note: "INA260 VIN- -> D36V50F5 VIN"}
  - {id: W24, type: wire_18awg_black, from: switch.vout, to: reg.vin, carries: logic_branch, via: [mid.right_strip, mid.over_power], note: "switch GND -> D36V50F5 GND: the INA260 terminal block has only VIN+ and VIN-"}
  - {id: W12, type: wire_22awg_quad, from: reg.vout, to: pi.gpio_power, carries: logic_5v_per_pin, parallel: 2, via: [mid.pca_rear], note: "Dupont crimps on the Pi end: pins 2+4 (5 V), 6+14 (GND)"}
  - {id: W13, type: wire_22awg_pair, from: button.terminals, to: switch.ab, via: [rear.outer_opening, rear.opening, mid.over_power, mid.right_strip], note: "momentary button -> switch A/B"}
  # --- signals
  - {id: W14, type: usb_a_c, from: pi.usb_low, to: xiao.usb, via: [], note: "Pi USB -> XIAO (power + serial)"}
  - {id: W15, type: usb_a_c, from: pi.usb_high, to: lidar_adapter.usb, via: [top.lidar_slot], note: "Pi USB -> LiDAR adapter through the top-shell slot"}
  - {id: W16, type: camera_ffc, from: pi.cam0, to: camera.ffc, via: [front.opening, front.outer_opening, front.ffc_shell], note: "22-to-15 pin ribbon; route last, no sharp folds"}
  - {id: W17, type: wire_22awg_i2c, from: xiao.pins, to: pca.header_left, via: [front.opening, mid.front_trunk, mid.pca_left], note: "I2C + 3V3 + GND: soldered to the XIAO pins (no room for Dupont housings under the upper shoulder frame), Dupont crimps at the PCA"}
  - {id: W18, type: stemma_qt, from: pca.header_right, to: imu.qt_right, via: [mid.left_strip], note: "STEMMA QT -> female sockets: the IMU sits under the Pi (2.5 mm under the PCB)"}
  - {id: W19, type: stemma_qt, from: imu.qt_left, to: ina.header, via: [], note: "STEMMA QT -> female sockets"}
  - {id: W20, type: wire_22awg_green, from: xiao.pins, to: pca.header_left, via: [front.opening, mid.front_trunk, mid.pca_left], note: "XIAO D3 -> PCA9685 OE (2.2 kOhm pull-up at the PCA)"}
  - {id: W21, type: lcd_cable, from: lcd.connector, to: xiao.pins, via: [front.outer_opening], note: "display cable; solder its Dupont end to the XIAO pins"}
  - {id: W22, type: wire_22awg_white, from: pi.gpio_poweroff, to: switch.ab, via: [mid.right_strip], note: "optional: GPIO 26 -> switch OFF"}
  - {id: W23, type: lidar_cable, from: lidar.cable, to: lidar_adapter.sensor, via: [top.pedestal_notch], note: "the sensor's own cable into the pedestal"}
