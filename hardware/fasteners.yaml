# Fastener catalogue (nominal ISO/DIN dimensions, mm). Keys are referenced by
# strido_cad.parts (new joints) and strido_cad.fasteners (upstream joints).
# kind: screw | nut | washer | standoff | insert. For screws `length` is the
# ISO nominal length (under the head). Steel class 8.8 or A2 stainless is fine;
# black-oxide 12.9 hex socket screws are the reference choice.
standards:
  iso4762: {title: "ISO 4762 socket head cap screw", head: cylinder}
  iso7380: {title: "ISO 7380 button head socket screw", head: dome}
  iso4032: {title: "ISO 4032 hex nut", head: hex}
  din985: {title: "DIN 985 nylon-insert lock nut", head: hex}
  iso7089: {title: "ISO 7089 flat washer", head: washer}
  standoff: {title: "Brass hex stand-off, female-female", head: hex}

thread: # nominal diameter, head diameter dk, head height k, hex key, nut across flats s, nut height m, nyloc height h
  M2: {d: 2.0, dk: 3.8, k: 2.0, key: 1.5, s: 4.0, m: 1.6, h: 2.8, washer_od: 5.0, washer_t: 0.3}
  M2.5: {d: 2.5, dk: 4.5, k: 2.5, key: 2.0, s: 5.0, m: 2.0, h: 3.5, washer_od: 6.0, washer_t: 0.5}
  M3: {d: 3.0, dk: 5.5, k: 3.0, key: 2.5, s: 5.5, m: 2.4, h: 4.0, washer_od: 7.0, washer_t: 0.5}
  M5: {d: 5.0, dk: 8.5, k: 5.0, key: 4.0, s: 8.0, m: 4.7, h: 5.0, washer_od: 10.0, washer_t: 1.0}

items:
