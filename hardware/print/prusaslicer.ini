# Strido print profile for the printability gate (`python -m strido_verify.printability`).
# Mirrors the settings in hardware/print/print_list.md: 220 x 220 x 250 mm bed, 0.4 mm nozzle,
# 0.2 mm layers, 3 perimeters, 5 top/bottom layers, 30 % gyroid, PETG. Per-part supports and
# brims come from the print list (the gate adds them on the command line).
# Load it in PrusaSlicer (File > Import > Import Config) to print with the verified settings.
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
gcode_flavor = marlin2
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_type = PETG
filament_density = 1.27
filament_cost = 25
temperature = 240
first_layer_temperature = 235
bed_temperature = 80
first_layer_bed_temperature = 80
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 5
fill_density = 30%
fill_pattern = gyroid
perimeter_generator = arachne
thin_walls = 0
support_material = 0
support_material_auto = 1
support_material_threshold = 0
support_material_style = snug
brim_width = 0
skirts = 1
gcode_label_objects = firmware
