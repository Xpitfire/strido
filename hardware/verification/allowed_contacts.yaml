# Contacts that are part of the design. Anything else found by
# strido_verify.contacts fails the check.

# Upstream STLs are placed by registration against the upstream STEP; the
# shells register with up to ~0.8 mm RMS (coarse STL chords), so overlaps
# between upstream parts below this depth are fits that exist in the upstream
# design, not new collisions.
upstream_fit_max_penetration_mm: 1.0

# Strido parts that are boolean edits of an upstream part keep its outer
# geometry and therefore its upstream fits.
derived_from_upstream:
  front_shell_display: front_shell
  top_shell_sensor: top_shell
  back_shell_button: back_shell
  electronics_deck: electronics_mounting_plate
  lower_shoulder_frame_front: lower_shoulder_frame
  lower_shoulder_frame_rear: lower_shoulder_frame

# Bodies with internal threads (a screw shank inside them is engagement).
threaded_parts:
  - waveshare_lcd_2inch      # factory M2 hex studs on the module
  - rplidar_c1               # M2.5 threaded inserts in the sensor base (max 4 mm)
  - standoff_m2_5_ff_6
  - standoff_m2_ff_8
  - iso4032_m2
  - iso4032_m2_5
  - iso4032_m3
  - din985_m3

