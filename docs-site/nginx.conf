# Static VitePress site (cleanUrls): /docs/foo serves docs/foo.html. Access control is the Cortex
# gateway's SSO in front of this container; nginx itself serves everything it is asked for.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /downloads/ {
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
}
