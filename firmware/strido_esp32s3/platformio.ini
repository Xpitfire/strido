; Strido MCU firmware. Build: pio run   |   Flash from the Pi: pio run -t upload
; Native unit tests of the pure-C++ core (kinematics, protocol, safety): pio test -e native
[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32 @ ~8.0.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.3
    adafruit/Adafruit LSM6DS @ ^4.7.4
    adafruit/Adafruit INA260 Library @ ^1.5.4
    adafruit/Adafruit AHRS @ ^2.4.0
    adafruit/Adafruit BusIO @ ^1.17.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    lovyan03/LovyanGFX @ ^1.2.36
test_ignore = *

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall
test_framework = unity
lib_compat_mode = off
build_src_filter = -<*>
